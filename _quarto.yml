    - 0-papers.qmd
    - 0-abbreviations.qmd
    # - 0-to_do.qmd
    - 1-introduction.qmd
    - 2-aims.qmd
    - 3-methods.qmd
    # - 4-results-1-ScR.qmd
    # - 4-results-2-baseline-tbl.qmd
    # - 4-results-3-cosim.qmd
    # - 4-results-5-fairness.qmd
    - 4-results.qmd
    - 5-discussion.qmd
