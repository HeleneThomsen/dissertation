project:
  type: book
  output-dir: docs

# quarto render --to pdf
book:
  title: "Machine learning methods for continuous glucose monitoring data and their potential in cardiovascular risk assessment"
  author: "Helene Bei Thomsen"
  date: 2026 07 31
  date-format: "YYYY"
  chapters:
    - index.qmd
    - 0-disclosure.qmd
    - 0-preface.qmd
    - 0-papers.qmd
    - 0-abbreviations.qmd
    # - 0-to_do.qmd
    - 1-introduction.qmd
    - 2-aims.qmd
    - 3-methods.qmd
    # - 4-results_cosim.qmd
    - 4-results.qmd
    - 5-discussion.qmd
    - 7-conclusions.qmd
    - 8-perspectives.qmd
    - references.qmd
    - 9-abstract-eng.qmd
    - 10-abstract-da.qmd
  
  appendices:
    - app1-supplementary.qmd
    # - app2-addendum.qmd
  # cookie-consent: 
  #   type: express
  #   palette: light
  # google-analytics:
  #   tracking-id: "G-98HE1VGDR4"

bibliography: references.bib
csl: citestyle.csl

execute:
  freeze: auto
  echo: false # change to false to hide code


filters:
  - acronyms


acronyms:
  # non_existing: error           # throw an error and refuse to render if abbreviation is used but not defined here
  style: long-short             # How abbreviations show up in text
  # include_unused: false
  # Handles list of abbreviation
  loa_title: ""                 # Remove the default package title on abbreviation list page
  insert_loa: false             # Do not add abbreviation list at default but where (\printacronyms) is placed
  sorting: alphabetical-case-insensitive # Organize list alphabetically regardless of CASE sensitivity
  # loa_header_classes:
  loa_format: '` **{shortname}**: {longname} `{=raw}'
  # fromfile: acronyms.yml
  keys:
    - shortname: CGM
      longname: continuous glucose monitoring
    - shortname: CVD
      longname: cardiovascular disease
    - shortname: T1D
      longname: type 1 diabetes
    - shortname: T2D
      longname: type 2 diabetes
    - shortname: HbA1c
      longname: hemoglobin A1c
    - shortname: SMBG
      longname: self-monitoring blood glucose
    - shortname: AGP
      longname: ambulatory glucose profile
    - shortname: TIR
      longname: time in range
    - shortname: TAR
      longname: time above range
    - shortname: TBR
      longname: time below range
    - shortname: GMI
      longname: glucose management indicator
    - shortname: CV
      longname: coefficient of variation
    - shortname: MBG
      longname: mean glucose
    - shortname: AID
      longname: Automated insulin delivery
    - shortname: SCORE2-Diabetes
      longname: Systematic Coronary Risk Evaluation 2-Diabetes
    - shortname: eGFR
      longname: estimated glomerular filtration rate
    - shortname: NT-proBNP
      longname: N-terminal Pro-B-type Natriuretic Peptide
    - shortname: AUROC
      longname: Area Under the Receiver Operating Characteristic Curve
    - shortname: RMSE
      longname: root mean square error 
    - shortname: T1DX
      longname: T1D Exchange
    - shortname: LMEM
      longname: linear mixed effect model
    - shortname: LSTM
      longname: long short term memory model
    - shortname: UMAP
      longname: Uniform Manifold Approximation and Projection 
    - shortname: LOCF
      longname: last observation carried forward 
    - shortname: IGLU
      longname: Interpreting Glucose Data from Continuous Glucose Monitors
    - shortname: SD
      longname: standard deviation
    - shortname: MAGE
      longname: mean amplitude of glycemic excursions
    # - shortname: 
    #   longname: 
    # - shortname: 
    #   longname: 
    # - shortname: 
    #   longname: 
    # - shortname: 
    #   longname: 
      
      

format:
  html:
    theme: cosmo
    default-image-extension: svg
    include-in-header:
      text: |
        <style>
        main.content {
          text-align: justify;
        }
        </style>
  docx: 
    toc: true
    number-sections: true
    number-depth: 2
    default-image-extension: tif
  pdf:
    documentclass: scrbook
    default-image-extension: png
    classoption:
     - headsepline=true
     - footsepline=true
     - open=any
     - numbers=noendperiod
    #  - chapterprefix=true
    keep-tex: true
    toc-depth: 2
    toc: false
    papersize: a4
    geometry:
      - top=20mm         # Margins from top edge of paper to the main text body
      - bottom=20mm      # Margins from bottom edge of paper to the main text body
      - inner=30mm
      - outer=20mm
      - headheight=15pt  # Fixes LaTeX warnings about header size allocation
      - headsep=7mm      # The gap between your running header line and your text
      - footskip=10mm    # The gap between your main text and your page numbers
    header-includes: |
      \usepackage{multirow}
      \usepackage{xcolor}
      \usepackage[table]{xcolor}
      \newcommand{\tablenote}[2][0.78\linewidth]{%
        \begin{center}
          \begin{minipage}{#1}
            \footnotesize
            #2
          \end{minipage}
        \end{center}
      }
      % \rowcolors{4}{gray!10}{white}
      \usepackage{float}
      \floatplacement{figure}{H}
      \raggedbottom

      \usepackage{graphicx}     % Required for resizing/scaling the number

      % Define the grey color for the big number to match "numbercolor" from Overleaf
      \definecolor{numbercolor}{gray}{0.7} 
      
      % --- TRANSLATED "JENOR" CHAPTER STYLE FOR KOMA-SCRIPT ---
      % Right-align everything by default
      \let\raggedchapter\raggedleft
      
      % Simplify the number output down to just the raw digits
      \renewcommand*{\chapterformat}{\thechapter}
      
      % Re-engineer the format: Dynamically flip layout with consistent bold weights
      \renewcommand*{\chapterlinesformat}[3]{%
        \ifstr{#1}{chapter}{%
          \normalfont\sffamily\color{black}%
          % If there is no number (like Preface/References), print title right/left aligned
          \ifstr{#2}{}{%
            \ifthispageodd{%
              \noindent\makebox[\linewidth][r]{\fontsize{25}{35}\selectfont\bfseries #3}%
            }{%
              \noindent\makebox[\linewidth][l]{\fontsize{25}{35}\selectfont\bfseries #3}%
            }%
          }{%
            % Check if page is Odd or Even
            \ifthispageodd{%
              % ODD PAGE (Right side): Bold title text, Bold giant number
              \noindent\makebox[\linewidth][r]{%
                \fontsize{25}{35}\selectfont\bfseries #3%
                \hspace{0.5em}%
                \raisebox{-6pt}{\fontsize{60}{0}\selectfont\bfseries\color{black!30} #2}% <- Enforced Bold
              }%
            }{%
              % EVEN PAGE (Left side): Bold giant number, Bold title text
              \noindent\makebox[\linewidth][l]{%
                \raisebox{-6pt}{\fontsize{60}{0}\selectfont\bfseries\color{black!30} #2}% <- Enforced Bold
                \hspace{0.5em}%
                \fontsize{25}{35}\selectfont\bfseries #3%
              }%
            }%
          }%
        }{%
          % Leave normal sections (2.1, 2.2) alone
          #2#3%
        }%
      }
        
      % Draw the elegant line cleanly beneath the layout grid
      \renewcommand*{\chapterheadendvskip}{%
        \vspace{1.5ex}%
        \noindent\color{black}\rule{\linewidth}{0.6pt}\par
        \vspace{4ex}%
        \noindent\ignorespaces
      }
      % -------------------------------------------------------------------------
      
      
      
      \usepackage{tocbibind}
      \usepackage{titling}
      \setlength{\droptitle}{-2cm}
      \preauthor{
          \begin{center}
          \large
          \lineskip 0.5em%
          PhD dissertation\\
          \vspace{25mm}
      }
      \postauthor{
          \end{center}
      }
      \predate{
          \begin{center}
          \vspace*{\fill}
          Health\\
          Aarhus University\\
      }
      \postdate{
          \\
          \resizebox{.9\textwidth}{!}{%
          \includegraphics[width=7in]{figures/au_health.png}%
          \quad
          \includegraphics[width=1in]{figures/qr_code.png}%
          }
          \end{center}
      }
      % --- FIX RUNNING HEADERS FROM CURSIVE TO NORMAL ---
      \setkomafont{pagehead}{\normalfont\sffamily}
      \setkomafont{pagenumber}{\normalfont\sffamily}

